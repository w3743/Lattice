[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice"
version = "0.1.0"
description = "From a circuit requirement to a verifiable schematic: unified circuit graphs, multi-fidelity simulation, and an auditable design evidence chain."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "Pint>=0.25.3,<0.26",
    "scipy>=1.11,<2",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110,<1",
    "pydantic>=2.6,<3",
    "uvicorn[standard]>=0.27,<1",
]
ml = [
    "joblib>=1.3,<2",
    "scikit-learn>=1.4,<2",
]
differentiable = [
    "torch>=2.2,<3",
]
test = [
    "hypothesis>=6.100,<7",
    "pytest>=8,<10",
]
all = [
    "fastapi>=0.110,<1",
    "hypothesis>=6.100,<7",
    "joblib>=1.3,<2",
    "pydantic>=2.6,<3",
    "pytest>=8,<10",
    "scikit-learn>=1.4,<2",
    "torch>=2.2,<3",
    "uvicorn[standard]>=0.27,<1",
]

[project.scripts]
lattice = "circuit_ai.cli:main"
lattice-pbdl = "circuit_ai.pbdl_cli:main"
# Pre-rename names kept as aliases so existing shell history and scripts keep
# working. The import package is still `circuit_ai` and the serialised schema
# ids are still `circuit_ai.*`; renaming those is a versioned-wire-contract
# change and has not been made.
circuit-ai = "circuit_ai.cli:main"
pbdl-synth = "circuit_ai.pbdl_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["circuit_ai*", "端口描述语言*"]
exclude = ["tests*"]
namespaces = false

[tool.setuptools.package-data]
circuit_ai = [
    "knowledge/*.yaml",
    "web/*.css",
    "web/*.html",
    "web/*.js",
]
"端口描述语言" = [
    "README.md",
    "examples/*.json",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --basetemp=.pytest_tmp"
testpaths = ["tests", "端口描述语言"]
python_files = ["test_*.py"]
